# CodeLve Configuration File

log_level = info

[ui]
window_title = CodeLve - Offline Code Analysis
window_width = 1024
window_height = 768
theme = light
file_browser.default_directory = C:\\

[llm]
model_path = models/codellama-34b-instruct.Q4_K_M.gguf
max_context_size = 8192
max_tokens = 2048
temperature = 0.7
preload_model = false

[prompts]
code_template = You are CodeLve, an AI assistant for code analysis.\nAnalyze the following code and answer the user's question:\n\n{context}\n\nUser query: {query}\nProvide a detailed and accurate response focusing on the code.
general_template = You are CodeLve, an AI assistant for developers.\nAnswer the following question based on your knowledge:\n\nUser query: {query}\nProvide a concise and helpful response.

[scanner]
max_file_size_bytes = 10485760
max_file_count = 10000
max_line_count = 10000
supported_extensions = cpp,h,hpp,c,cs,java,py,js,ts,go,rs,php,rb,swift,kt,scala
exclude_directories = node_modules,build,dist,target,bin,obj,.git,.svn,.hg,.vs,.idea,venv,__pycache__